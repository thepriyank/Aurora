[project]
name = "jarvis-brain"
version = "0.1.0"
description = "Local-LLM agent core for the Jarvis assistant. Drop-in brain for backtalk."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
jarvis-brain = "jarvis_brain.__main__:main"

[tool.setuptools]
packages = ["jarvis_brain", "jarvis_brain.providers", "jarvis_brain.tools"]

[tool.uv]
package = true
# On Windows/ARM64 uv's managed CPython is x86-64 and runs under emulation
# (~10x slower for torch / whisper). Prefer a native system Python.
python-preference = "system"
